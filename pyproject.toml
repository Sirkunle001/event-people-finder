[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-people-finder"
version = "0.1.0"
description = "Keyless event-people extraction: speakers and sponsors of any Brella-powered conference, with names, titles, companies and websites. No account, no cookies, no API key."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gafar Akinkunmi" }]
dependencies = ["curl_cffi>=0.7"]

[project.scripts]
event-people-finder = "event_people_finder.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
  "BLE001",
  "S110",
  "S112",
  "SIM115",
]
